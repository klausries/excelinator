[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "xlcells-engine-bundled"
version = "0.1.0"
description = "The engine of xlcells with Polars built in: calculates Excel formulas, gives sheets and regions as dataframes, stores, and the look of cells"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["xlcells", "polars>=1.3"]

# The same code as xlcells-engine (bindings/python-engine), built with its Polars.
[tool.maturin]
manifest-path = "../python-engine/Cargo.toml"
features = ["bundled"]
module-name = "xlcells_engine_bundled._engine"
python-source = "python"
