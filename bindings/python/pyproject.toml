[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "xlcells"
version = "0.1.0"
description = "Read and write Excel workbooks as cell tables; includes a pyExcelerator-compatible API"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"

[tool.maturin]
module-name = "xlcells._xlcells"
python-source = "python"
