[package]
name = "rust_lib_xl_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
xl-mcp = { path = "../../../crates/xl-mcp" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# The engine is as fast in a debug build of the app as it is in a release build.
[profile.dev]
opt-level = 3
debug = false

# What is shipped: optimised across crates, so that what the app does not call is left out.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 4
