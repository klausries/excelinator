name: xl_app_web
description: The excelinator app as HTML, for the browser and for a chat (MCP App) - it draws the screens of xl_app_core.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.5
  web: ^1.1.0
  xl_app_core:
    path: ../core

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  lints: ^5.0.0
  stream_channel: ^2.1.0
  test: ^1.25.0

jaspr:
  mode: client
