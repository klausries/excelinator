[project]
name = "@NAME@"
version = "0.1.0"
description = "@TITLE@, ported to Python and Polars (made by xlcells from @WORKBOOK@)"
requires-python = ">=3.11"
dependencies = ["polars>=2.1,<3"]

[project.optional-dependencies]
# The formula engine of xlcells: works out exactly what is not ported yet, and gives the
# way back into the workbook (run.py --excel, check.py --exact).
excel = ["xlcells"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
