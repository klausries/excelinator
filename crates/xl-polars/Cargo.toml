[package]
name = "xl-polars"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The engine of xl-engine on Polars: its formula expressions run by Polars, frames as Polars frames, stores with Parquet"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
polars = { version = "=0.55.2", default-features = false, features = ["lazy", "round_series", "abs", "dtype-u8", "cum_agg", "strings", "log", "temporal", "replace", "search_sorted", "regex", "parquet"] }
xl-cells = { version = "0.1.0", path = "../xl-cells" }
xl-engine = { version = "0.1.0", path = "../xl-engine" }
xl-formula = { version = "0.1.0", path = "../xl-formula" }

[dev-dependencies]
xl-xls = { version = "0.1.0", path = "../xl-xls" }
