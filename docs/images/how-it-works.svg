<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="390" rx="16" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker>
  </defs>
  <!-- workbook -->
  <rect x="30" y="120" width="190" height="120" rx="12" fill="#e8f3ec" stroke="#107c41" stroke-width="2"/>
  <text x="125" y="160" text-anchor="middle" font-size="20" font-weight="700" fill="#107c41">Excel workbook</text>
  <text x="125" y="188" text-anchor="middle" font-size="14" fill="#33414d">.xlsx / .xls</text>
  <text x="125" y="210" text-anchor="middle" font-size="14" fill="#33414d">data + formulas</text>
  <!-- store -->
  <rect x="320" y="100" width="260" height="160" rx="12" fill="#eef4fb" stroke="#0f6cbd" stroke-width="2"/>
  <text x="450" y="138" text-anchor="middle" font-size="20" font-weight="700" fill="#0f6cbd">Tables + logic</text>
  <text x="450" y="166" text-anchor="middle" font-size="14" fill="#33414d">regions found in the sheets</text>
  <text x="450" y="188" text-anchor="middle" font-size="14" fill="#33414d">Parquet files that carry</text>
  <text x="450" y="208" text-anchor="middle" font-size="14" fill="#33414d">their formulas as notes</text>
  <text x="450" y="236" text-anchor="middle" font-size="13" fill="#5f6b76">calculated exactly as Excel does</text>
  <!-- outputs -->
  <rect x="680" y="30" width="250" height="80" rx="12" fill="#fff7e6" stroke="#c4590f" stroke-width="2"/>
  <text x="805" y="64" text-anchor="middle" font-size="18" font-weight="700" fill="#c4590f">Python program</text>
  <text x="805" y="88" text-anchor="middle" font-size="13" fill="#33414d">Polars only, checked value by value</text>
  <rect x="680" y="140" width="250" height="80" rx="12" fill="#f3eefb" stroke="#8a3ab9" stroke-width="2"/>
  <text x="805" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#8a3ab9">AI agents</text>
  <text x="805" y="198" text-anchor="middle" font-size="13" fill="#33414d">MCP server + porting skill</text>
  <rect x="680" y="250" width="250" height="80" rx="12" fill="#e8f3ec" stroke="#107c41" stroke-width="2"/>
  <text x="805" y="284" text-anchor="middle" font-size="18" font-weight="700" fill="#107c41">Back to Excel</text>
  <text x="805" y="308" text-anchor="middle" font-size="13" fill="#33414d">same layout, new data</text>
  <!-- arrows -->
  <line x1="222" y1="180" x2="316" y2="180" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="582" y1="150" x2="676" y2="75" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="582" y1="180" x2="676" y2="180" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="582" y1="210" x2="676" y2="285" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="480" y="368" text-anchor="middle" font-size="13" fill="#5f6b76">one engine in Rust, shipped as WebAssembly: the same on Windows, macOS and Linux, x64 and ARM</text>
</svg>
